name: Sync Nuvio TMDB lists
run-name: Sync Nuvio TMDB lists — ${{ github.event_name == 'schedule' && '04:07 Europe/Athens' || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do not write TMDB lists
        type: boolean
        default: true
  schedule:
    - cron: "7 4 * * *"
      timezone: "Europe/Athens"

permissions:
  contents: write

concurrency:
  group: nuvio-tmdb-list-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Europe/Athens
      TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
      TMDB_USER_ACCESS_TOKEN: ${{ secrets.TMDB_USER_ACCESS_TOKEN }}
      TMDB_ACCOUNT_OBJECT_ID: ${{ secrets.TMDB_ACCOUNT_OBJECT_ID }}
      TMDB_LANGUAGE: "el"
      CONFIRM_TMDB_LIST_WRITES: NUVIO-TMDB-LISTS
      ALLOW_TMDB_LIST_BOOTSTRAP: "2675"
      TMDB_HTTP_CONCURRENCY: "16"
      NUVIO_SYNC_CONCURRENCY: "12"
      TMDB_WORLDWIDE_REGION_CONCURRENCY: "12"
      NUVIO_SYNC_WRITE_CONCURRENCY: "20"
      NUVIO_REMOTE_AUDIT_RETRIES: "2"
      NUVIO_REMOTE_AUDIT_RETRY_DELAY_MS: "5000"
      NUVIO_AWARD_REFRESH_DAYS: "7"
      TMDB_CREATE_INTERVAL_MS: "2500"
      TMDB_SPAM_COOLDOWN_MS: "60000"
      TMDB_CLEAR_SETTLE_MS: "10000"
      TMDB_CLEAR_RECOVERY_SETTLE_MS: "45000"
      NUVIO_INITIAL_READBACK_ATTEMPTS: "4"
      NUVIO_RECOVERY_READBACK_ATTEMPTS: "8"
      TMDB_ORDER_REPAIR_CLEAR_SETTLE_MS: "60000"
      TMDB_ORDER_REPAIR_STABILITY_MS: "60000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test and audit
        run: npm test && npm run audit
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm run sync:dry
      - name: Execute sync
        id: execute_sync
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: npm run sync
      - name: Checkpoint sync progress
        if: always() && steps.execute_sync.outcome != 'skipped' && (github.event_name == 'schedule' || !inputs.dry_run)
        shell: bash
        run: |
          git config user.name "nuvio-collections-bot"
          git config user.email "nuvio-collections-bot@users.noreply.github.com"
          git add state reports/latest.json
          git diff --cached --quiet || git commit -m "chore: checkpoint Nuvio TMDB sync"
          git push
      - name: Exact remote audit and deleted-ID reconciliation
        id: remote_audit
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: npm run audit:remote:repair
      - name: Checkpoint remote audit progress
        if: always() && steps.remote_audit.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "nuvio-collections-bot"
          git config user.email "nuvio-collections-bot@users.noreply.github.com"
          git add state reports/remote-audit.json
          git diff --cached --quiet || git commit -m "chore: checkpoint Nuvio remote audit"
          git push
      - name: Compile and production audit
        if: github.event_name == 'schedule' || !inputs.dry_run
        run: npm run compile && npm run audit -- --production
      - name: Commit generated state
        if: github.event_name == 'schedule' || !inputs.dry_run
        shell: bash
        run: |
          git config user.name "nuvio-collections-bot"
          git config user.email "nuvio-collections-bot@users.noreply.github.com"
          git add config state dist reports
          git diff --cached --quiet || git commit -m "chore: sync Nuvio TMDB lists"
          git push
      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-sync-report-${{ github.run_id }}
          path: reports/latest.json
          if-no-files-found: warn
      - name: Upload remote audit report
        if: always() && steps.remote_audit.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-remote-audit-${{ github.run_id }}
          path: reports/remote-audit.json
          if-no-files-found: warn
